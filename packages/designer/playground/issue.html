<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report Tool 발행 화면</title>
    <style>
      body {
        background: #f5f7fb; color: #172033; font-family: Pretendard, system-ui, sans-serif;
        margin: 0; padding: 32px;
      }
      main { background: #fff; border-radius: 12px; margin: 0 auto; max-width: 620px; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.hint { color: #64748b; font-size: 13px; margin: 0 0 20px; }
      label { display: block; font-size: 13px; margin-bottom: 6px; }
      select, button, input {
        border: 1px solid #e4e9f2; border-radius: 8px; font: inherit; padding: 8px 12px;
      }
      button { background: #4f46e5; border-color: #4f46e5; color: #fff; cursor: pointer; }
      button:disabled { background: #e2e8f0; border-color: #e2e8f0; color: #94a3b8; cursor: default; }
      .row { align-items: center; display: flex; gap: 8px; margin-bottom: 16px; }
      #link { flex: 1; }
      #log { color: #64748b; font-size: 13px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>급여명세서 발행</h1>
      <p class="hint">담당자 화면입니다. 발행하면 수신자에게 보낼 링크가 나옵니다.</p>
      <label for="recipient">받는 사람</label>
      <div class="row">
        <select id="recipient">
          <option value="emp-1">홍길동 (개발지원팀)</option>
          <option value="emp-2">김서연 (인사팀)</option>
          <option value="emp-3">박준호 (영업팀)</option>
        </select>
        <button id="issue" type="button">발행하고 링크 만들기</button>
      </div>
      <div class="row">
        <input id="link" type="text" readonly placeholder="링크가 여기에 나옵니다" />
        <button id="copy" type="button" disabled>복사</button>
        <button id="open" type="button" disabled>열어 보기</button>
      </div>
      <p id="log"></p>
    </main>
    <script type="module" src="./issue.ts"></script>
  </body>
</html>
