<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Tool Designer Playground</title>
    <style>
      html, body { height: 100%; }
      body { background: #e9edf5; display: flex; gap: 16px; margin: 0; padding: 16px; }
      #designer { flex: 1; min-height: 0; }
      #saved-json {
        background: #0f172a; border-radius: 12px; color: #cbd5e1; flex: none;
        font-size: 10px; line-height: 1.5; margin: 0; overflow: auto; padding: 12px;
        width: 240px;
      }
      /*
        좁은 창에서는 JSON 칸을 접는다.

        편집기는 왼쪽 데이터·가운데 캔버스·오른쪽 속성의 세 칸 구조다. 여기에
        240px을 더 붙이면 창이 좁을 때 속성 패널이 화면 밖으로 밀려 손댈 수
        없게 된다. 저장될 JSON은 참고용이고, 속성 패널은 작업 도구다.
      */
      @media (max-width: 1200px) {
        #saved-json { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="designer"></div>
    <pre id="saved-json">편집하면 저장될 JSON이 여기에 나타납니다.</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
